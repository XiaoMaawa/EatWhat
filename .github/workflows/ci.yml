name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 提交信息规范校验（仅在 PR 时执行）
  commitlint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check commit messages
        run: |
          npx --yes @commitlint/cli@18 \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --config commitlint.config.js

  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Detect Maven project
        id: detect
        run: |
          if [ -f "backend/pom.xml" ] || [ -f "pom.xml" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未检测到 Maven 工程，跳过后端构建"
          fi

      - name: Build with Maven
        if: steps.detect.outputs.found == 'true'
        run: |
          cd ${{ hashFiles('backend/pom.xml') != '' && 'backend' || '.' }}
          mvn -B -ntp clean verify

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend project
        id: detect
        run: |
          if [ -f "frontend/package.json" ] || [ -f "package.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未检测到前端工程，跳过前端构建"
          fi

      - name: Set up pnpm
        if: steps.detect.outputs.found == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: |
          cd ${{ hashFiles('frontend/package.json') != '' && 'frontend' || '.' }}
          pnpm install --frozen-lockfile

      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: |
          cd ${{ hashFiles('frontend/package.json') != '' && 'frontend' || '.' }}
          pnpm build

  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint markdown documents
        run: |
          npx --yes markdownlint-cli2 \
            "docs/**/*.md" "README.md" "CONTRIBUTING.md" \
            "#node_modules" || true
        # 文档格式问题不阻断构建，仅提示
